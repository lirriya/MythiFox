<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MythiFox</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <header class="header">
      <img class="logo" src="assets/logo.png" alt="logo of the site" />
      <div class="search-form" action="#" method="get">
        <input type="text" placeholder="Search MythiFox..." name="q">
      </div>
      <a class="sign-in" href="./authentication/register.html">Sign-in</a>
    </header>
    <main>
      <div class="post-form">
        <h2>Share a post</h2>
        <form method="POST" enctype="multipart/form-data">
          <textarea name="content" placeholder="Tell a story..."
            required></textarea> <br>
          <button class="send" type="submit" name="post">Post</button>
        </form>
      </div>
    </main>
  </body>
</html>
